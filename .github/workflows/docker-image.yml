name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set Antigravity cli version
      id: antigravity_version
      run: echo "antigravity_version=1.1.10" >> $GITHUB_OUTPUT
    - name: Output docker image id with antigravity version
      run: echo "peez/antigravity-cli:${{ steps.antigravity_version.outputs.antigravity_version }}"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          antigravity_version=${{ steps.antigravity_version.outputs.antigravity_version }}
        tags: peez/antigravity-cli:latest, peez/antigravity-cli:${{ steps.antigravity_version.outputs.antigravity_version }}
    - name: Output Docker Tags to Job Summary
      run: |
        echo "### 🐳 Built and Pushed Docker Tags" >> $GITHUB_STEP_SUMMARY
        echo "- \`p&#8203;eez/antigravity-cli:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`p&#8203;eez/antigravity-cli:${{ steps.antigravity_version.outputs.antigravity_version }}\`" >> $GITHUB_STEP_SUMMARY

